[build]
	publish = "html/"
	functions = "functions/"
	command = "npm run prod"

[functions."resolve-instagram-links"]
	schedule = "@weekly"

# Runs at 12:00, 16:00, 18:00, 21:00 and 23:00 UTC (fixed - not adjusted
# for UK daylight saving, so during BST this is an hour later in UK local
# time, e.g. 1pm/5pm/7pm/10pm/midnight).
[functions."import-next-review"]
	schedule = "0 12,16,18,21,23 * * *"

[[headers]]
	for = "/*"

	[headers.values]
		X-Content-Type-Options = "nosniff"
		Content-Security-Policy = "frame-ancestors 'none';"
		X-Frame-Options = "DENY"
		X-XSS-Protection = "1; mode=block"
		Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
	for = "/rss"
	[headers.values]
		Content-Type = "text/xml"

[[headers]]
	for = "/sitemap.xml"
	[headers.values]
		Content-Type = "text/xml"

[[headers]]
	for = "/sitemap-beers.xml"
	[headers.values]
		Content-Type = "text/xml"

[[headers]]
	for = "/sitemap-breweries.xml"
	[headers.values]
		Content-Type = "text/xml"

[[headers]]
	for = "/api/beers.json"
	[headers.values]
		Content-Type = "application/json"

[[headers]]
	for = "/api/breweries.json"
	[headers.values]
		Content-Type = "application/json"

[[headers]]
	for = "/api/canonicals.json"
	[headers.values]
		Content-Type = "application/json"
